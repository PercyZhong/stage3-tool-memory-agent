[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stage3-tool-memory-agent"
version = "0.1.0"
description = "Auditable offline ReAct tool-and-memory agent for synthetic campus tasks"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [{name = "PercyZhong"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]
hf = ["torch==2.5.1", "transformers>=4.46,<5", "accelerate>=1.0,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
